<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чи поїде Дмитро на ДН до Олега?</title>
<meta name="description" content="Найточніший у світі прогноз: чи поїде Дмитро на день народження до Олега.">
<meta property="og:title" content="Чи поїде Дмитро на ДН до Олега?">
<meta property="og:description" content="Найточніший у світі прогноз. Натисни «Дізнатись».">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#f2f3f5; --muted:#8b909c; --track:#262a33; --c:#e5484d; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display:flex; align-items:center; justify-content:center; padding:16px; overflow:hidden; }
  main { width:100%; max-width:440px; text-align:center; position:relative; z-index:1; }
  h1 { font-size:clamp(24px, 6.5vw, 32px); line-height:1.15; font-weight:800; letter-spacing:-.02em; margin-bottom:28px; }
  .sub { color:var(--muted); margin:10px 0 28px; font-size:15px; }
  .gauge { position:relative; width:min(78vw, 280px); aspect-ratio:1; margin:0 auto; }
  .gauge svg { width:100%; height:100%; transform:rotate(-90deg); }
  .gauge circle { fill:none; stroke-width:14; }
  .track { stroke:var(--track); }
  .bar { stroke:var(--c); stroke-linecap:round; transition:stroke .3s; filter:drop-shadow(0 0 10px var(--c)); }
  .val { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .num { font-size:clamp(52px, 17vw, 72px); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:var(--c); transition:color .3s; }
  .num small { font-size:.45em; }
  .label { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.12em; margin-top:-4px; }
  .status { min-height:48px; margin:22px 0 18px; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .status.done { font-size:22px; font-weight:800; color:var(--c); }
  button { appearance:none; border:0; border-radius:14px; padding:16px 34px; font:inherit; font-size:18px; font-weight:700;
           background:var(--text); color:var(--bg); cursor:pointer; transition:transform .1s, opacity .2s; }
  button:active { transform:scale(.96); }
  button:disabled { opacity:.35; cursor:default; }
  body.win { animation:flash .9s ease-out; }
  body.win .gauge { animation:pop .5s ease-out; }
  @keyframes flash { from { background:#123d24; } to { background:var(--bg); } }
  @keyframes pop { 50% { transform:scale(1.07); } }
  .shake { animation:shake .35s; }
  @keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:0; }
  footer { position:fixed; bottom:12px; left:0; right:0; text-align:center; color:#4a4f5a; font-size:12px; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main>
  <h1>Чи поїде Дмитро на день народження до Олега? 🎂</h1>
  <div class="gauge" id="gauge">
    <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="bar" id="bar" cx="60" cy="60" r="52"/></svg>
    <div class="val"><div class="num" id="num">?</div><div class="label">імовірність</div></div>
  </div>
  <div class="status" id="status"></div>
  <button id="go">Дізнатись</button>
</main>
<footer>mdmy.me</footer>
<script>
(() => {
  const bar = document.getElementById('bar'), num = document.getElementById('num'), status = document.getElementById('status'),
        btn = document.getElementById('go'), gauge = document.getElementById('gauge'), root = document.documentElement;
  const C = 2 * Math.PI * 52;
  bar.style.strokeDasharray = C; bar.style.strokeDashoffset = C;

  // [до скількох %, тривалість мс]
  const STEPS = [[34, 1600], [67, 1500], [81, 1100], [23, 1300], [9, 900], [46, 1400], [72, 1200], [38, 1000], [91, 1500], [100, 900]];

  const color = p => p >= 100 ? '#30d158' : p >= 70 ? '#a3d93a' : p >= 45 ? '#f5c518' : p >= 20 ? '#ff8a3d' : '#e5484d';
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  let cur = 0;

  function show(p) {
    cur = p;
    const c = color(p);
    root.style.setProperty('--c', c);
    bar.style.strokeDashoffset = C * (1 - p / 100);
    num.innerHTML = Math.round(p) + '<small>%</small>';
  }

  function tween(to, ms) {
    return new Promise(done => {
      const from = cur, t0 = performance.now();
      (function frame(now) {
        const t = Math.min(1, (now - t0) / ms);
        show(from + (to - from) * ease(t));
        t < 1 ? requestAnimationFrame(frame) : done();
      })(t0);
    });
  }

  async function run() {
    btn.disabled = true; btn.textContent = 'Рахуємо…';
    document.body.classList.remove('win'); status.classList.remove('done');
    show(0);
    status.textContent = '';
    for (const [to, ms] of STEPS) {
      const drop = to < cur;
      await tween(to, ms);
      if (drop) { gauge.classList.remove('shake'); void gauge.offsetWidth; gauge.classList.add('shake'); }
      await new Promise(r => setTimeout(r, drop ? 450 : 250));
    }
    status.textContent = 'ДМИТРО ЇДЕ! 🎉'; status.classList.add('done');
    document.body.classList.add('win');
    confetti();
    btn.disabled = false; btn.textContent = 'Перевірити ще раз';
  }

  // конфеті
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  function confetti() {
    const W = cv.width = innerWidth, H = cv.height = innerHeight;
    const cols = ['#30d158', '#f5c518', '#ff8a3d', '#5ac8fa', '#ff375f', '#bf5af2'];
    const ps = Array.from({ length: 160 }, () => ({
      x: W / 2, y: H * .45, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4,
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, s: 6 + Math.random() * 6, c: cols[Math.random() * cols.length | 0]
    }));
    const t0 = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, W, H);
      for (const p of ps) {
        p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      }
      if (now - t0 < 4500) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    })(t0);
  }

  btn.addEventListener('click', run);
})();
</script>
</body>
</html>
