<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mdmy.me</title>
  <meta name="description" content="mdmy.me — робочі інструменти Дмитра Максимчука">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #F5F5F3;
      --ink: #0B0B0C;
      --muted: #6B6B66;
      --card: #FFFFFF;
      --line: #E4E4E0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0B0C;
        --ink: #F5F5F3;
        --muted: #8A8A86;
        --card: #161617;
        --line: #2A2A2B;
      }
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    header { display: flex; flex-direction: column; gap: 12px; }
    h1 {
      margin: 0;
      font-size: clamp(44px, 10vw, 104px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    header p {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      width: min(620px, 100%);
    }
    nav a {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 22px 22px 20px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: inherit;
      text-decoration: none;
      text-align: left;
      transition: transform .15s ease, border-color .15s ease;
    }
    nav a:hover { transform: translateY(-2px); border-color: var(--muted); }
    nav a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    nav .ico { font-size: 26px; line-height: 1; }
    nav strong { font-size: 19px; font-weight: 750; letter-spacing: -0.01em; margin-top: 6px; }
    nav span { color: var(--muted); font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <header>
    <h1>mdmy.me</h1>
    <p>робочі інструменти</p>
  </header>
  <nav aria-label="Розділи">
    <a href="/assistant/">
      <span class="ico" aria-hidden="true">🎙️</span>
      <strong>Задачі й асистент</strong>
      <span>Простори, канбан-дошки, нотатки. Голос і Telegram.</span>
    </a>
    <a href="/nakladna/">
      <span class="ico" aria-hidden="true">🧾</span>
      <strong>Видаткові накладні</strong>
      <span>Замовлення з LP-CRM → готова накладна в PDF.</span>
    </a>
  </nav>
</body>
</html>
